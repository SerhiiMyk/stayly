services:
  e2e:
    build:
      dockerfile: ./Dockerfile
    volumes:
      - ./specs:/usr/src/app/specs
    depends_on:
      - reservations
      - auth
      - payments
      - notifications
      - mongo
  reservations:
    image: 113903681878.dkr.ecr.eu-north-1.amazonaws.com/reservations:latest
    env_file:
      - ../apps/reservations/.env
    ports:
      - '3000:3000'
  auth:
    image: 113903681878.dkr.ecr.eu-north-1.amazonaws.com/auth:latest
    env_file:
      - ../apps/auth/.env
    ports:
      - '3001:3001'
    volumes:
      - .:/usr/src/app
  payments:
    image: 113903681878.dkr.ecr.eu-north-1.amazonaws.com/payments:latest
    env_file:
      - ../apps/payments/.env
  notifications:
    image: 113903681878.dkr.ecr.eu-north-1.amazonaws.com/notifications:latest
    env_file:
      - ../apps/notifications/.env
  mongo:
    image: mongo
